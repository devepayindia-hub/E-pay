# Trivy Configuration for ePay CRM
# Usage: trivy --config .trivy.yaml <path>

scan:
  # Scan types: filesystem, image, rootfs, repository
  format: table
  output: trivy-results.txt

  # Severity levels: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL
  severity:
    - CRITICAL
    - HIGH

  # Exit code settings
  exit_code: 0  # Never fail the build on vulnerabilities (report only)
  skip_dirs:
    - node_modules
    - .git
    - .vscode
    - .vs
  skip_files:
    - Dockerfile
    - docker-compose.yml
    - .dockerignore

# Vulnerability settings
vulnerability:
  # Type of vulnerabilities to scan
  type:
    - os
    - library

  # Ignore unfixed vulnerabilities
  ignore-unfixed: true

  # Severity configuration
  severity:
    - CRITICAL
    - HIGH

# Security checks
security-checks:
  vulnerability: true
  configuration: true
  secret: true

# Cache settings
cache:
  dir: .trivy/cache
  dry-run: false

# Input settings
input: .