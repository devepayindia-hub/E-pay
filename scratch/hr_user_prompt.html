            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 12.5px;
            cursor: pointer;
            color: #064e3b;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .tab:hover {
            color: #047857;
        }
        .tab.active {
            background: #fff;
            color: #064e3b;
            box-shadow: 0 2px 8px rgba(5, 150, 105, 0.08);
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(5, 150, 105, 0.25);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: #fff;
            border-radius: 18px;
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px;
            box-shadow: 0 32px 80px rgba(5, 150, 105, 0.15);
            animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #d1fae5;
        }
        .modal .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #064e3b;
        }
        .modal .modal-header h3 i {
            color: #059669;
        }
        .modal .modal-header .close {
            background: none;
            border: none;
            font-size: 26px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: var(--transition);
            line-height: 1;
        }
        .modal .modal-header .close:hover {
            color: var(--gray-700);
            background: #ecfdf5;
        }
        .modal .form-group {
            margin-bottom: 16px;
        }
        .modal .form-group label {
            display: block;
            font-weight: 500;
            font-size: 12.5px;
            color: #064e3b;
            margin-bottom: 4px;
        }
        .modal .form-group label .required {
            color: #dc2626;
            margin-left: 2px;
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid #d1fae5;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            outline: none;
            transition: all var(--transition);
            font-family: var(--font);
            background: #fff;
            color: var(--gray-800);
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }
        .modal .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }
        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .modal .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #d1fae5;
        }

        /* --- CHART GRID --- */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .chart-box {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px 22px;
            border: 1px solid #d1fae5;
            box-shadow: var(--shadow);
        }
        .chart-box h4 {
            font-size: 14px;
            font-weight: 600;
            color: #064e3b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-box h4 i {
            color: #059669;
        }
        .chart-box canvas {
            max-height: 210px;
            max-width: 100%;
        }

        /* --- AI INSIGHT --- */
        .ai-insight {
            background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
            color: #fff;
            border-radius: var(--radius);
            padding: 18px 26px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .ai-insight i {
            font-size: 30px;
            color: #6ee7b7;
            flex-shrink: 0;
        }
        .ai-insight .content {
            flex: 1;
            min-width: 160px;
        }
        .ai-insight .content .title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.5;
        }
        .ai-insight .content .message {
            font-size: 14.5px;
            font-weight: 450;
            line-height: 1.5;
        }
        .ai-insight .badge-ai {
            background: rgba(16, 185, 129, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
            letter-spacing: 0.5px;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* --- FILTER BAR --- */
        .filter-bar {
            background: #fff;
            border-radius: var(--radius);
            padding: 16px 20px;
            border: 1px solid #d1fae5;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
            box-shadow: var(--shadow);
        }
        .filter-bar .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 140px;
            min-width: 120px;
        }
        .filter-bar .filter-group label {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-bar .filter-group input,
        .filter-bar .filter-group select {
            padding: 7px 12px;
            border: 1px solid #d1fae5;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #fff;
            font-family: var(--font);
            color: var(--gray-800);
            transition: var(--transition);
        }
        .filter-bar .filter-group input:focus,
        .filter-bar .filter-group select:focus {
            border-color: #059669;
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.1);
        }
        .filter-bar .filter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* --- DOCUMENT CARDS --- */
        .doc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 8px;
        }
        .doc-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 20px 16px;
            border: 1px solid #d1fae5;
            box-shadow: var(--shadow);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }
        .doc-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #059669;
        }
        .doc-card i {
            font-size: 34px;
            color: #059669;
            margin-bottom: 6px;
        }
        .doc-card h4 {
            font-size: 13.5px;
            font-weight: 600;
            margin: 6px 0 2px;
            color: #064e3b;
        }
        .doc-card p {
            font-size: 11.5px;
            color: var(--gray-500);
            margin: 0;
        }
        .doc-card .badge-doc {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: #ecfdf5;
            color: #064e3b;
        }
        .doc-card .badge-doc.blue {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .doc-card .badge-doc.green {
            background: #dcfce7;
            color: #065f46;
        }
        .doc-card .badge-doc.orange {
            background: #fef3c7;
            color: #b45309;
        }
        .doc-card .badge-doc.red {
            background: #fee2e2;
            color: #b91c1c;
        }
        .doc-card .badge-doc.purple {
            background: #f3e8ff;
            color: #7c3aed;
        }

        /* --- TOAST --- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: #064e3b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(5, 150, 105, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13.5px;
            animation: slideUp 0.35s ease;
            border-left: 4px solid #059669;
            backdrop-filter: blur(4px);
        }
        .toast.success {
            border-left-color: #059669;
        }
        .toast.error {
            border-left-color: #dc2626;
        }
        .toast.warning {
            border-left-color: #d97706;
        }
        .toast.info {
            border-left-color: #059669;
        }
        @keyframes slideUp {
            from {
                transform: translateY(24px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .toast i {
            font-size: 18px;
            flex-shrink: 0;
        }
        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .toast-close:hover {
            color: #fff;
        }

        /* --- EMPTY STATE --- */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-500);
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.25;
            margin-bottom: 12px;
        }
        .empty-state h4 {
            color: var(--gray-700);
            margin-bottom: 4px;
            font-weight: 500;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 992px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .modal .form-row {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            }
        }
        @media (max-width: 768px) {
            #sidebar {
                transform: translateX(-100%);
            }
            #sidebar.open {
                transform: translateX(0);
                box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
            }
            #main {
                margin-left: 0;
            }
            #header .hamburger {
                display: block;
            }
            #header .page-title small {
                display: none;
            }
            .header-actions .search-box input {
                width: 100px;
            }
            #pageContent {
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .modal {
                padding: 24px 20px;
                margin: 12px;
            }
            .filter-bar .filter-group {
                flex: 1 1 100%;
                min-width: 0;
            }
            .doc-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-actions .search-box {
                display: none;
            }
            #header {
                padding: 0 16px;
            }
            .modal .form-row {
                grid-template-columns: 1fr;
            }
            .ai-insight {
                flex-direction: column;
                align-items: flex-start;
            }
            .ai-insight .badge-ai {
                align-self: flex-start;
            }
        }

        /* --- UTILITY --- */
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
        }
        .flex-center {
            align-items: center;
            justify-content: center;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--gray-500);
        }
        .text-sm {
            font-size: 12.5px;
        }
        .text-xs {
            font-size: 11px;
        }
        .fw-600 {
            font-weight: 600;
        }
        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .modal::-webkit-scrollbar {
            width: 4px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #d1fae5;
            border-radius: 10px;
        }

        @keyframes highlight-fade {
            0% {
                background: rgba(5, 150, 105, 0.15);
            }
            100% {
                background: transparent;
            }
        }
        .highlight-row {
            animation: highlight-fade 1.2s ease;
        }

        /* --- OFFER LETTER PREVIEW --- */
        .offer-preview {
            background: #fff;
            border: 1px solid #d1fae5;
            border-radius: var(--radius);
            padding: 36px 40px;
            box-shadow: var(--shadow-lg);
            max-width: 840px;
            margin: 0 auto;

            line-height: 1.7;

        .offer-preview .header {

            color: var(--gray-500);

        .offer-preview .footer .qr .box {
            width: 70px;
            height: 70px;
            background: #ecfdf5;
            border: 1px solid #d1fae5;

            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--gray-600);

        function loadDB() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (!raw) return defaultDB();
                const data = JSON.parse(raw);
                const def = defaultDB();
                for (const k in def) { if (!data[k]) data[k] = def[k]; }
                return data;
            } catch (_) { return defaultDB(); }
        }

        function genId(collection) {
            const key = collection + 'Id';
            if (!db.nextId) db.nextId = {};

            return db.nextId[key]++;
        }

        function formatDate(d) {
            if (!d) return '—';
            const dt = new Date(d);
            if (isNaN(dt)) return '—';
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { info: 'fa-circle-info', success: 'fa-check-circle', error: 'fa-exclamation-circle',
                warning: 'fa-triangle-exclamation' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML =
                `<i class="fas ${icons[type] || icons.info}"></i><span>${msg}</span><button class="toast-close"><i class="fas fa-xmark"></i></button>`;
            el.querySelector('.toast-close').addEventListener('click', () => el.remove());
            container.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
        }

        function showModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('open');
            const firstInput = document.querySelector('#modalContent input, #modalContent select, #modalContent textarea');
            if (firstInput) setTimeout(() => firstInput.focus(), 100);
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
        document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget)

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            let html = '';
            for (const sec of NAV_SECTIONS) {
                html += `<div class="nav-section">${sec.group}</div>`;
                for (const item of sec.items) {
                    const active = item.id === currentPage ? 'active' : '';
                    const count = getCount(item.id);
                    const badge = count > 0 ? `<span class="badge">${count}</span>` : '';
                    html +=
                        `<div class="nav-item ${active}" data-page="${item.id}"><i class="fas ${item.icon}"></i> ${item.label} ${badge}</div>`;
                }
            }
            nav.innerHTML = html;
            nav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.page;
                    if (id) navigateTo(id);
                });
            });
            if (currentUser) {
                document.getElementById('sidebarAvatar').textContent = currentUser.avatar || currentUser.name[0];
                document.getElementById('sidebarName').textContent = currentUser.name;
                const roleMap = { admin: 'Administrator', hr: 'HR Manager', employee: 'Employee' };
                document.getElementById('sidebarRole').textContent = roleMap[currentUser.role] || 'Employee';
            }
            document.getElementById('logoutBtn').addEventListener('click', () => {
                if (confirm('Logout from HR+ session?')) {
                    currentUser = null;
                    renderApp();
                }
            });
        }

        function getCount(pageId) {
            const counts = {
                employees: db.employees?.length || 0,
                attendance: db.attendance?.length || 0,
                leaves: db.leaves?.filter(l => l.status === 'pending').length || 0,
                candidates: db.candidates?.length || 0,
                grievances: db.grievances?.filter(g => g.status === 'open' || g.status === 'in-progress').length || 0,
                helpdesk: db.helpdeskTickets?.filter(t => t.status === 'open' || t.status === 'in-progress').length || 0,
                requisitions: db.requisitions?.filter(r => r.status === 'open' || r.status === 'interviewing').length ||
                    0,
                performances: db.performances?.length || 0,
                offerLetters: db.offerLetters?.filter(o => o.status === 'draft' || o.status === 'pending-approval')
                    .length || 0,
            };
            return counts[pageId] || 0;
        }

        function saveJobProfile(event, id) {
            event.preventDefault();
            const name = document.getElementById('jpName').value.trim();
            const department = document.getElementById('jpDept').value;
            const designation = document.getElementById('jpDesignation').value.trim();
            const category = document.getElementById('jpCat').value;
            const fullSalary = parseFloat(document.getElementById('jpFullSalary').value) || 20000;
            const internSalary = parseFloat(document.getElementById('jpInternSalary').value) || 10000;
            const reportingTo = document.getElementById('jpReporting').value.trim() || 'Manager';
            const summary = document.getElementById('jpSummary').value.trim();
            const respText = document.getElementById('jpResponsibilities').value;
            const responsibilities = respText.split('\n').filter(s => s.trim().length > 0);
            const skillsText = document.getElementById('jpSkills').value;
            const requiredSkills = skillsText.split(',').map(s => s.trim()).filter(s => s.length > 0);
            const probation = document.getElementById('jpProbation').value.trim() || '3 months';
            const notice = document.getElementById('jpNotice').value.trim() || '30 days';
            const workingHours = document.getElementById('jpWorkingHours').value.trim() || '9:00 AM – 6:00 PM';
            const weeklyOff = document.getElementById('jpWeeklyOff').value.trim() || 'Saturday & Sunday';
            const leavePolicy = document.getElementById('jpLeavePolicy').value.trim() || 'Standard leave policy';
            const perfText = document.getElementById('jpPerformance').value;
            const performanceExpectations = perfText.split('\n').filter(s => s.trim().length > 0);
            const confidentiality = document.getElementById('jpConfidentiality').value.trim() ||
                'You shall maintain strict confidentiality of all company information.';
            const termination = document.getElementById('jpTermination').value.trim() ||
                'Either party may terminate with 30 days notice.';

            if (!name || !designation) return toast('Name and designation required.', 'warning');

            const profile = {
                name,
                department,
                category,
                designation,
                defaultFullTimeSalary: fullSalary,
                defaultInternSalary: internSalary,
                reportingTo,
                status: 'active',
                jobSummary: summary || '—',
                responsibilities: responsibilities.length ? responsibilities : ['—'],
                requiredSkills: requiredSkills.length ? requiredSkills : ['—'],
                probationPeriod: probation,
                noticePeriod: notice,
                workingHours,
                weeklyOff,
                leavePolicy,
                performanceExpectations: performanceExpectations.length ? performanceExpectations : ['—'],
                confidentialityClause: confidentiality,
                terminationClause: termination,
                ipClause: 'Any intellectual property created during employment shall be the property of the company.',
                companyPolicies: 'You shall adhere to all company policies, code of conduct, and applicable laws.'
            };

            if (id) {
                const idx = db.jobProfiles.findIndex(x => x.id === id);
                if (idx === -1) return toast('Not found', 'error');
                db.jobProfiles[idx] = { ...db.jobProfiles[idx], ...profile };
                toast('Profile updated!', 'success');
                logOfferAudit('Profile Updated', profile.name, null, 'Job Profile');
            } else {
                profile.id = genId('jobProfile');
                db.jobProfiles.push(profile);
                toast('Profile created!', 'success');
                logOfferAudit('Profile Created', profile.name, null, 'Job Profile');
            }
            saveDB();
            closeModal();
            renderApp();
        }

            db.jobProfiles = db.jobProfiles.filter(x => x.id !== id);
            saveDB();
            toast('Profile deleted.', 'info');
            renderApp();
        }

                    const prof = db.jobProfiles.find(p => p.id === o.profileId);
                    return `<tr>
                      <td><strong>${o.offerId}</strong></td>
                      <td>${o.employeeName}</td>
                      <td>${prof ? prof.name : '—'}</td>
                      <td>${o.employmentType}</td>
                      <td><span style="font-weight:600;color:var(--primary)">₹${o.salary?.toLocaleString() || '—'}</span></td>
                      <td>${o.incentive && o.incentive !== 'No Incentive' ? o.incentive : '—'}</td>
                      <td><span class="status-badge ${o.status}">${o.status}</span></td>
                      <td>
                        <button class="btn btn-sm btn-primary" onclick="openPreviewOffer(${o.id})"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-success" onclick="generateOfferPDF(${o.id})"><i class="fas fa-file-pdf"></i></button>
                        ${o.status === 'draft' || o.status === 'previewed' ? `<button class="btn btn-sm btn-warning" onclick="approveOffer(${o.id})"><i class="fas fa-check"></i></button>` : ''}
                        ${o.status === 'approved' ? `<button class="btn btn-sm btn-primary" onclick="sendOffer(${o.id})"><i class="fas fa-paper-plane"></i></button>` : ''}
                        <button class="btn btn-sm btn-danger" onclick="deleteOffer(${o.id})"><i class="fas fa-trash"></i></button>
                      </td>
                    </tr>`;
                  }).reverse().join('') || '<tr><td colspan="8" class="text-muted text-center">No offer letters created. Click "Create Offer" to start.</td></tr>'}
                </tbody>
              </table>
            </div></div>`;
        }

        // --- CREATE OFFER — HR ONLY 6 FIELDS ----------------------------

        function openCreateOffer() {
            ensureOfferDB();
            const profileOpts = (db.jobProfiles || []).filter(p => p.status === 'active').map(p =>
                `<option value="${p.id}">${p.name}</option>`).join('');
            showModal(`
            <div class="modal-header"><h3><i class="fas fa-file-signature"></i> Create Offer Letter</h3><button class="close" onclick="closeModal()">&times;</button></div>
            <div style="background:var(--gray-50);border-radius:8px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:var(--gray-600);">
              <i class="fas fa-info-circle" style="color:var(--primary)"></i> HR enters only <strong>6 fields</strong>. Salary, responsibilities, policies, and company info load automatically from the backend.
            </div>
            <form id="offerForm" onsubmit="saveOffer(event)">
              <div class="form-group"><label>Employee Name <span class="required">*</span></label><input type="text" id="ofEmployeeName" required placeholder="Rahul Sharma" /></div>
              <div class="form-row">
                <div class="form-group"><label>Interviewed Date <span class="required">*</span></label><input type="date" id="ofInterviewDate" required /></div>
                <div class="form-group"><label>Joining Date <span class="required">*</span></label><input type="date" id="ofJoiningDate" required /></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Profile <span class="required">*</span></label><select id="ofProfile" required onchange="updateOfferSalary()">${profileOpts || '<option value="">No profiles configured</option>'}</select></div>
                <div class="form-group"><label>Employment Type <span class="required">*</span></label><select id="ofEmploymentType" required onchange="updateOfferSalary()">
                  <option value="Intern">Intern</option>
                  <option value="Full-Time" selected>Full-Time</option>
                </select></div>
              </div>
              <div class="form-group"><label>Incentive</label>
                <select id="ofIncentive" onchange="toggleIncentiveInput()">
                  <option value="No Incentive">No Incentive</option>
                  <option value="Fixed">Fixed Amount (₹)</option>
                  <option value="Percentage">Percentage (%)</option>
                </select>
              </div>
              <div class="form-group" id="incentiveInputGroup" style="display:none;">
                <label>Incentive Value</label>
                <input type="text" id="ofIncentiveValue" placeholder="5000 or 10" />
              </div>
              <div style="background:var(--gray-50);border-radius:8px;padding:14px 18px;margin:12px 0;font-size:13px;">
                <div><strong>Auto-Loaded Salary:</strong> <span id="ofAutoSalary">20,000</span></div>
                <div style="font-size:12px;color:var(--gray-500);">(Based on profile and employment type — backend controlled)</div>
              </div>
              <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Preview Offer</button></div>
            </form>`);
            // Set default dates
            const now = new Date();
            document.getElementById('ofInterviewDate').value = now.toISOString().slice(0, 10);
            const join = new Date(now);
            join.setDate(join.getDate() + 7);
            document.getElementById('ofJoiningDate').value = join.toISOString().slice(0, 10);
            updateOfferSalary();
        }

        function toggleIncentiveInput() {
            const val = document.getElementById('ofIncentive').value;
            document.getElementById('incentiveInputGroup').style.display = (val === 'Fixed' || val === 'Percentage') ?
                'block' : 'none';
        }

        function updateOfferSalary() {
            const profileId = parseInt(document.getElementById('ofProfile').value);
            const empType = document.getElementById('ofEmploymentType').value;
            const prof = db.jobProfiles.find(p => p.id === profileId);
            if (prof) {
                const salary = empType === 'Intern' ? prof.defaultInternSalary : prof.defaultFullTimeSalary;
                document.getElementById('ofAutoSalary').textContent = '₹' + (salary || 0).toLocaleString();
            } else {
                document.getElementById('ofAutoSalary').textContent = '0';
            }
        }

        function saveOffer(event) {
            event.preventDefault();
            ensureOfferDB();
            const name = document.getElementById('ofEmployeeName').value.trim();
            const interviewDate = document.getElementById('ofInterviewDate').value;
            const joiningDate = document.getElementById('ofJoiningDate').value;
            const profileId = parseInt(document.getElementById('ofProfile').value);
            const empType = document.getElementById('ofEmploymentType').value;
            const incentiveType = document.getElementById('ofIncentive').value;
            let incentiveValue = document.getElementById('ofIncentiveValue').value.trim();

            if (!name || !interviewDate || !joiningDate || !profileId) {
                return toast('Please fill all required fields.', 'warning');
            }

            const prof = db.jobProfiles.find(p => p.id === profileId);
            if (!prof) return toast('Profile not found.', 'error');

            const salary = empType === 'Intern' ? prof.defaultInternSalary : prof.defaultFullTimeSalary;
            let incentiveDisplay = 'No Incentive';
            if (incentiveType === 'Fixed' && incentiveValue) {
                incentiveDisplay = '₹' + parseFloat(incentiveValue).toLocaleString();
            } else if (incentiveType === 'Percentage' && incentiveValue) {
                incentiveDisplay = incentiveValue + '%';
            } else if (incentiveType === 'No Incentive') {
                incentiveDisplay = 'No Incentive';
            }

            // Generate offer ID
            const prefix = db.companySettings?.offerPrefix || 'OFF';
            const year = new Date().getFullYear();
            const count = (db.offerLetters || []).length + 1;
            const offerId = prefix + '-' + year + '-' + String(count).padStart(6, '0');

            const offer = {
                id: genId('offerLetter'),
                offerId: offerId,
                employeeName: name,
                interviewedDate: interviewDate,
                joiningDate: joiningDate,
                profileId: profileId,
                employmentType: empType,
                incentive: incentiveDisplay,
                incentiveRaw: incentiveType === 'Fixed' ? parseFloat(incentiveValue) || 0 :
                    incentiveType === 'Percentage' ? parseFloat(incentiveValue) || 0 : 0,
                incentiveType: incentiveType,
                salary: salary,
                status: 'previewed',
                offerDate: todayStr(),
                offerExpiry: new Date(new Date().getTime() + (db.companySettings?.offerExpiryDays || 7) * 24 * 60 * 60 *
                    1000).toISOString().slice(0, 10),
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                approvedBy: '',
                approvedAt: '',
                pdfPath: '',
                auditLog: [{
                    timestamp: new Date().toISOString(),
                    action: 'Offer Created',
                    user: currentUser?.name || 'System'
                }]
            };

            db.offerLetters.push(offer);
            logOfferAudit('Offer Created', name, offer.offerId, 'Offer');
            saveDB();
            closeModal();
            toast('Offer preview generated!', 'success');
            // Navigate to offer list
            navigateTo('offerLetters');
            setTimeout(() => openPreviewOffer(offer.id), 300);
        }

        // --- PREVIEW OFFER ----------------------------------------------

        function openPreviewOffer(id) {
            const offer = db.offerLetters.find(o => o.id === id);
            if (!offer) return toast('Offer not found', 'error');
            const prof = db.jobProfiles.find(p => p.id === offer.profileId);
            if (!prof) return toast('Profile not found', 'error');
            const company = db.companySettings || {};

            const previewHTML = buildOfferPreview(offer, prof, company);
            showModal(previewHTML);
        }
    </script>
</body>
</html>
