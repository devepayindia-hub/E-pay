<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AM · Assistant Manager Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js">
    </script>
    <style>



        /* --- CSS VARIABLES --- */
        :root {
            /* ===== GREEN THEME (matched to ePay Arrival Manager) ===== */
            --green-50: #ecfdf5;
            --green-100: #d1fae5;
            --green-200: #a7f3d0;
            --green-300: #6ee7b7;
            --green-400: #34d399;
            --green-500: #10b981;
            --green-600: #059669;
            --green-700: #047857;
            --green-800: #065f46;
            --green-900: #064e3b;

            --white: #ffffff;
            --off-white: #f4fbf8;
            --surface: #e6f4ee;
            --ink: #f0faf5;
            --ink-2: #e3f3eb;
            --ink-3: #d3ece1;

            --text: #0a2e1f;
            --text-secondary: #1b4d3a;
            --text-muted: #2b5e47;

            --border: #b8d9cc;
            --border-light: #d5ede2;

            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;

            --shadow-sm: 0 1px 3px rgba(5, 150, 105, 0.08), 0 1px 2px rgba(5, 150, 105, 0.05);
            --shadow: 0 4px 20px rgba(5, 150, 105, 0.10), 0 1px 4px rgba(5, 150, 105, 0.06);
            --shadow-md: 0 8px 30px rgba(5, 150, 105, 0.12), 0 2px 8px rgba(5, 150, 105, 0.06);
            --shadow-lg: 0 20px 50px rgba(5, 150, 105, 0.14), 0 6px 16px rgba(5, 150, 105, 0.08);
            --shadow-green: 0 8px 30px rgba(5, 150, 105, 0.20), 0 2px 8px rgba(5, 150, 105, 0.10);
            --shadow-green-lg: 0 20px 50px rgba(5, 150, 105, 0.25), 0 6px 16px rgba(5, 150, 105, 0.12);

            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);

            /* Primary brand (green) */
            --primary: #059669;
            --primary-light: #10b981;
            --primary-dark: #047857;
            --primary-glow: rgba(5, 150, 105, 0.25);

            /* Semantic */
            --success: #10b981;
            --warning: #d97706;
            --danger: #ef4444;
            --secondary: #0ea5e9;

            /* Neutral scale mapped to green-tinted grays */
            --gray-50: #f0faf5;
            --gray-100: #e6f4ee;
            --gray-200: #d5ede2;
            --gray-300: #b8d9cc;
            --gray-400: #8fbfa8;
            --gray-500: #2b5e47;
            --gray-600: #1b4d3a;
            --gray-700: #0f3d2c;
            --gray-800: #0a2e1f;
            --gray-900: #062218;

            /* Layout */
            --sidebar-width: 260px;
            --header-height: 64px;
            --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--ink);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #062218 0%, #0a2e1f 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform var(--transition);
            overflow-y: auto;
            padding: 0 0 16px 0;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
        }
        #sidebar .brand {
            padding: 20px 24px 16px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #sidebar .brand i {
            color: var(--primary-light);
            font-size: 28px;
        }
        #sidebar .brand span {
            color: #fff;
        }
        #sidebar .brand small {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.4;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .nav-section {
            padding: 18px 24px 6px 24px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.35;
            font-weight: 600;
            color: #a0aec0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 20px;
            margin: 1px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            color: #94a3b8;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            position: relative;
            user-select: none;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(16, 185, 129, 0.18);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.15);
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12%;
            height: 76%;
            width: 3px;
            background: var(--primary-light);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 12px var(--primary-glow);
        }
        .nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .nav-item .badge {
            margin-left: auto;
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            padding: 1px 9px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .nav-item .badge.green {
            background: var(--success);
        }
        .nav-item .badge.warning {
            background: var(--warning);
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .sidebar-footer .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(11, 143, 108, 0.3);
        }
        .sidebar-footer .info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-footer .info .name {
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .info .role {
            font-size: 11px;
            opacity: 0.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer .logout-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 17px;
            transition: var(--transition);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-footer .logout-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.12);
        }

        /* --- MAIN --- */
        #main {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--gray-50);
        }

        /* --- HEADER --- */
        #header {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 16px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        #header .hamburger {
            display: none;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--gray-700);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }
        #header .hamburger:hover {
            background: var(--gray-100);
        }
        #header .page-title {
            font-size: 19px;
            font-weight: 600;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-900);
        }
        #header .page-title small {
            font-weight: 400;
            color: var(--gray-500);
            font-size: 13px;
            margin-left: 4px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-100);
            border-radius: 30px;
            padding: 6px 16px 6px 14px;
            gap: 8px;
            border: 1px solid transparent;
            transition: all var(--transition);
        }
        .header-actions .search-box:focus-within {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .header-actions .search-box input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 13px;
            padding: 6px 0;
            width: 160px;
            color: var(--gray-700);
            font-family: var(--font);
        }
        .header-actions .search-box input::placeholder {
            color: var(--gray-400);
        }
        .header-actions .search-box i {
            color: var(--gray-400);
            font-size: 14px;
        }
        .header-actions .notif {
            position: relative;
            background: none;
            border: none;
            font-size: 20px;
            color: var(--gray-600);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .header-actions .notif:hover {
            background: var(--gray-100);
        }
        .header-actions .notif .dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 9px;
            height: 9px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid #fff;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* --- PAGE CONTENT --- */
        #pageContent {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px 40px;
        }

        /* --- STATS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 14px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: var(--transition);
        }
        .stat-card:hover::after {
            opacity: 1;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .stat-card .label {
            font-size: 11px;
            color: var(--gray-500);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-card .label i {
            font-size: 13px;
            opacity: 0.7;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 2px;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .stat-card .change {
            font-size: 10px;
            font-weight: 500;
            margin-top: 3px;
            display: inline-block;
            padding: 1px 10px;
            border-radius: 20px;
            background: var(--gray-100);
        }
        .stat-card .change.up {
            color: var(--success);
            background: #dcfce7;
        }
        .stat-card .change.down {
            color: var(--danger);
            background: #fee2e2;
        }
        .stat-card .change.neutral {
            color: var(--gray-500);
            background: var(--gray-100);
        }

        /* --- SECTION HEADER --- */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray-800);
        }
        .section-header h2 i {
            color: var(--primary);
        }
        .section-header h2 .sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--gray-500);
            margin-left: 4px;
        }

        /* --- BUTTONS --- */
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
            background: var(--gray-200);
            color: var(--gray-700);
            font-family: var(--font);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 16px var(--primary-glow);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-warning:hover {
            background: #ca8a04;
        }
        .btn-sm {
            padding: 3px 10px;
            font-size: 10px;
            border-radius: 5px;
        }
        .btn-xs {
            padding: 2px 8px;
            font-size: 9px;
            border-radius: 4px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-600);
        }
        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }
        .btn-ghost {
            background: transparent;
            color: var(--gray-600);
        }
        .btn-ghost:hover {
            background: var(--gray-100);
        }

        /* --- TABLE --- */
        .table-wrap {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .table-scroll {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }
        table th {
            background: var(--gray-50);
            text-align: left;
            padding: 9px 12px;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--gray-100);
            vertical-align: middle;
            color: var(--gray-700);
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: var(--gray-50);
        }

        /* --- STATUS BADGES --- */
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: capitalize;
            letter-spacing: 0.2px;
        }
        .status-badge.active {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.pending {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.inactive {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.completed {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .status-badge.on-hold {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .status-badge.review {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.approved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.rejected {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.open {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.resolved {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.in-progress {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.scheduled {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.critical {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.high {
            background: #fef3c7;
            color: #b45309;
        }
        .status-badge.medium {
            background: #e0f2fe;
            color: #0369a1;
        }
        .status-badge.low {
            background: #dcfce7;
            color: #15803d;
        }
        .status-badge.danger {
            background: #fee2e2;
            color: #b91c1c;
        }
        .status-badge.warning {
            background: #fef3c7;
            color: #b45309;
        }

        /* --- AVATARS --- */
        .avatar-sm {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-light);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 10px;
            margin-right: 6px;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .avatar-sm.green {
            background: var(--success);
        }
        .avatar-sm.orange {
            background: var(--warning);
        }
        .avatar-sm.purple {
            background: #8b5cf6;
        }
        .avatar-sm.red {
            background: var(--danger);
        }
        .avatar-sm.blue {
            background: var(--secondary);
        }
        .avatar-sm.gray {
            background: var(--gray-400);
        }

        .cell-flex {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .text-muted {
            color: var(--gray-500);
            font-size: 12px;
        }
        .text-sm {
            font-size: 11.5px;
        }
        .text-xs {
            font-size: 10px;
        }
        .fw-600 {
            font-weight: 600;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-right {
            text-align: right;
        }

        /* --- TABS --- */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--gray-100);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 5px 14px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 11.5px;
            cursor: pointer;
            color: var(--gray-600);
            transition: all var(--transition);
            font-family: var(--font);
        }
        .tab:hover {
            color: var(--gray-900);
        }
        .tab.active {
            background: #fff;
            color: var(--gray-900);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;

            to {

            animation: modalSlide 0.3s ease;

            to {

                opacity: 1;

            border-radius: 50%;

            line-height: 1;

            color: var(--gray-800);

            align-items: center;

            font-weight: 450;
            line-height: 1.5;

        /* --- FILTER BAR --- */
        .filter-bar {

            gap: 10px;
            align-items: flex-end;
            box-shadow: var(--shadow);

            gap: 3px;

            min-width: 80px;

            font-size: 9.5px;
            font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;

            font-weight: 700;
            font-size: 12px;
            min-width: 32px;

        }

        /* --- STATUS INDICATOR --- */
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;

        .status-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;

            background: var(--warning);

        .status-indicator .dot.red {
            background: var(--danger);
        }
        .status-indicator .dot.blue {
            background: var(--secondary);
        }
        .status-indicator .dot.gray {
            background: var(--gray-400);
        }

        /* --- TOAST --- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 340px;
            width: 100%;
        }
        .toast {
            background: var(--gray-900);
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12.5px;
            animation: slideUp 0.35s ease;
            border-left: 4px solid var(--primary);
            backdrop-filter: blur(4px);
        }
        .toast.success {
            border-left-color: var(--success);
        }
        .toast.error {
            border-left-color: var(--danger);
        }
        .toast.warning {
            border-left-color: var(--warning);
        }
        .toast.info {
            border-left-color: var(--secondary);
        }
        @keyframes slideUp {
            from {
                transform: translateY(24px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .toast i {
            font-size: 15px;
            flex-shrink: 0;
        }
        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            font-size: 13px;
            padding: 0 4px;
            transition: var(--transition);
        }
        .toast .toast-close:hover {
            color: #fff;

        function loadDB() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (!raw) return defaultDB();
                const data = JSON.parse(raw);
                const def = defaultDB();
                for (const k in def) { if (!data[k]) data[k] = def[k]; }
                if (!data.nextId) data.nextId = {};
                const idKeys = ['task', 'complaint', 'expense', 'pettyCash', 'approval', 'maintenance', 'stockCount',
                    'damagedStock', 'membership', 'shiftHandover', 'incident'
                ];
                for (const key of idKeys) {
                    if (!data.nextId[key]) data.nextId[key] = 1;
                }
                return data;
            } catch (_) { return defaultDB(); }
        }

        function genId(collection) {
            const key = collection + 'Id';
            if (!db.nextId) db.nextId = {};
            if (!db.nextId[key]) db.nextId[key] = 1;
            return db.nextId[key]++;
        }

        function getEmployee(id) { return db.employees.find(e => e.id === id); }

        function getEmployeeName(id) { const e = getEmployee(id); return e ? e.name : 'Unknown'; }

        function formatDate(d) {
            if (!d) return '';
            const dt = new Date(d);
            if (isNaN(dt)) return '';
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateFull(d) {
            if (!d) return '';
            const dt = new Date(d);
            if (isNaN(dt)) return '';
            return dt.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit',
                minute: '2-digit' });
        }

        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function nowISO() { return new Date().toISOString(); }

        function formatCurrency(amount) {
            if (amount >= 10000000) return '₹' + (amount / 10000000).toFixed(1) + 'Cr';
            if (amount >= 100000) return '₹' + (amount / 100000).toFixed(1) + 'L';
            if (amount >= 1000) return '₹' + (amount / 1000).toFixed(1) + 'K';
            return '₹' + amount.toLocaleString();
        }

        function formatCurrencyFull(amount) {
            return '₹' + amount.toLocaleString('en-IN');
        }

        function saveHandover(event) {
            event.preventDefault();
            const from = document.getElementById('handoverFrom').value;
            const to = document.getElementById('handoverTo').value;
            const issues = parseInt(document.getElementById('handoverIssues').value) || 0;
            const complaints = parseInt(document.getElementById('handoverComplaints').value) || 0;
            const stock = parseInt(document.getElementById('handoverStock').value) || 0;
            const maintenance = parseInt(document.getElementById('handoverMaintenance').value) || 0;
            const cash = document.getElementById('handoverCash').value;
            const notes = document.getElementById('handoverNotes').value.trim() || '';
            if (from === to) return toast('From and To must be different.', 'warning');
            db.shiftHandovers.push({
                id: genId('shiftHandover'),
                from,
                to,
                date: todayStr(),
                openIssues: issues,
                pendingComplaints: complaints,
                stockIssue: stock,
                maintenance: maintenance,
                cashStatus: cash,
                notes,
                acknowledged: false
            });
            saveDB();
            toast('Handover submitted!', 'success');
            closeModal();
            renderApp();
        }

            renderApp();

        function saveTaskAM(event) {
            event.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            const category = document.getElementById('taskCat').value;
            const priority = document.getElementById('taskPriority').value;
            const assignedTo = document.getElementById('taskAssign').value;
            const dueDate = document.getElementById('taskDue').value;
            const estTime = parseFloat(document.getElementById('taskEst').value) || 1;
            const progress = parseInt(document.getElementById('taskProg').value) || 0;
            if (!title) return toast('Title required.', 'warning');
            db.tasks.push({
                id: genId('task'),
                title,
                category,
                priority,
                assignedTo,
                status: 'pending',
                created: todayStr(),
                dueDate,
                estimatedTime: estTime,
                actualTime: 0,
                progress,
                blocked: false
            });
            saveDB();
            toast('Task created!', 'success');
            closeModal();
            renderApp();
        }

        function completeTaskAM(id) {
            const t = db.tasks.find(x => x.id === id);
            if (!t) return toast('Not found', 'error');
            t.status = 'completed';
            t.progress = 100;
            saveDB();
            toast('Task completed!', 'success');
            renderApp();
        }

        function unblockTaskAM(id) {
            const t = db.tasks.find(x => x.id === id);

            t.status = 'in-progress';
            t.blocked = false;
            saveDB();
            toast('Task unblocked!', 'success');

        function blockTaskAM(id) {

        function openStockCount() {

            showModal(`
            <div class="modal-header"><h3><i class="fas fa-calculator"></i> New Stock Count</h3><button class="close" onclick="closeModal()">&times;</button></div>
            <form id="stockCountForm" onsubmit="saveStockCount(event)">

              <div class="form-row">
                <div class="form-group"><label>System Quantity</label><input type="number" id="scSystem" required /></div>

              </div>

            </form>
          `);
        }

        function saveStockCount(event) {
            event.preventDefault();
            const product = document.getElementById('scProduct').value;
            const system = parseInt(document.getElementById('scSystem').value) || 0;
            const physical = parseInt(document.getElementById('scPhysical').value) || 0;
            const counter = document.getElementById('scCounter').value.trim() || currentUser.name;
            const verifier = document.getElementById('scVerifier').value.trim() || 'Sunita Rao';
            const remarks = document.getElementById('scRemarks').value.trim() || '';
            const diff = system - physical;
            const valueVariance = diff * 20000; // approximate
            db.stockCounts.push({
                id: genId('stockCount'),
                product,
                systemQty: system,
                physicalQty: physical,
                difference: diff,
                valueVariance: valueVariance,
                counter,
                verifier,
                date: todayStr(),
                remarks
            });
            // Update inventory if significant
            if (Math.abs(diff) > 2) {
                const item = db.inventoryItems.find(i => i.product === product);
                if (item) {
                    item.stock = physical;
                    if (physical < item.minStock) item.status = 'low';
                    else item.status = 'good';
                }
            }
            saveDB();
            toast('Stock count saved!', 'success');
            closeModal();
            renderApp();
        }

        function saveIncident(event) {
            event.preventDefault();
            const type = document.getElementById('incType').value.trim();
            const severity = document.getElementById('incSeverity').value;
            const location = document.getElementById('incLocation').value.trim() || '';
            const desc = document.getElementById('incDesc').value.trim();
            const escalateTo = document.getElementById('incEscalate').value.trim() || 'Anita Desai';
            if (!type || !desc) return toast('Type and description required.', 'warning');
            db.incidents.push({
                id: genId('incident'),
                type,
                severity,
                location,
                description: desc,
                peopleInvolved: '',
                immediateAction: 'Reported',
                evidence: '',
                escalatedTo: escalateTo,
                resolution: '',
                rootCause: '',
                closure: null
            });
            // If critical, auto-escalate
            if (severity === 'critical' || severity === 'high') {
                db.complaints.push({
                    id: genId('complaint'),
                    customer: 'System',
                    category: 'Incident',
                    severity: severity,
                    description: `Incident: ${type} - ${desc}`,
                    status: 'open',
                    created: todayStr(),
                    sla: severity === 'critical' ? '2h' : '12h',
                    assignedTo: escalateTo,
                    resolution: ''
                });
            }
            saveDB();
            toast('Incident reported!', 'success');
            closeModal();
            renderApp();
        }

    <script src="session-timer-service.js"></script>
    <script src="email-service.js"></script>
    <script src="calling-service.js"></script>
    <script src="firebase-init.js"></script>
    <script src="session-manager.js"></script>

    <!-- Logout Handler Script -->
    <script type="text/javascript">    function handleCRMLogout() {
        const btn = document.getElementById('logout-btn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        
        try {
            if (typeof firebase === 'undefined') {
                console.warn('Firebase not initialized');
                window.location.href = '/login.html';
                return;
            }

            const auth = firebase.auth();
            const user = auth.currentUser;

            if (!user) {
                console.info('No user logged in');
                window.location.href = '/login.html';
                return;
            }

            // Get active time from session timer
            let activeTimeMs = 0;
            if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getActiveTime) {
                activeTimeMs = window.sessionTimerService.getActiveTime();
            }

            // Send logout email notification
            if (typeof window.emailService !== 'undefined' && window.emailService.sendLogoutNotification) {
                window.emailService.sendLogoutNotification(user, activeTimeMs)
                    .then(() => {
                        console.info('? Logout email sent');
                        performLogout(auth);
                    })
                    .catch(error => {
                        console.error('? Email send failed:', error);
                        performLogout(auth); // Logout anyway
                    });
            } else {
                console.warn('EmailService not available, proceeding with logout');
                performLogout(auth);
            }
        } catch (error) {
            console.error('Logout error:', error);
            btn.disabled = false;
            btn.textContent = 'Logout';
            alert('Error during logout: ' + error.message);
        }
    }

    function performLogout(auth) {
        auth.signOut().then(() => {
            console.info('? User signed out');
            // Redirect to login
            window.location.href = '/login.html';
        }).catch(error => {
            console.error('Sign-out error:', error);
            window.location.href = '/login.html'; // Redirect anyway
        });
    }

    // Update timer display every second
    function updateTimerDisplay() {
        const timerDisplay = document.getElementById('session-timer-display');
        if (!timerDisplay) return;

        if (typeof window.sessionTimerService !== 'undefined' && window.sessionTimerService.getFormattedActiveTime) {
            try {
                const formattedTime = window.sessionTimerService.getFormattedActiveTime();
                timerDisplay.textContent = formattedTime;
            } catch (e) {
                console.debug('Timer update error:', e);
            }
        }
    }

    // Start timer updates when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setInterval(updateTimerDisplay, 1000);
        });
    } else {
        setInterval(updateTimerDisplay, 1000);
    }

    // Listen for services ready event
    window.addEventListener('crm-services-ready', () => {
        console.info('? CRM services ready on this page');
    });

    window.addEventListener('crm-services-error', (e) => {
        console.error('? CRM services error:', e.detail);
    });
    </script>
  <script src="local-crud.js"></script>
</body>
